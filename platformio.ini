; ================================================================
; ESP32-S3 OV2640/OV3660 Teletubby Blob Detector w/ Autotune
; Board: Freenove ESP32-S3 WROOM CAM (FNK0085) - 16MB Flash / 8MB PSRAM
;
; Serial uses CH343 USB-UART chip (not native USB CDC).
; Install CH343 driver if Serial doesn't appear:
;   Windows/Mac: https://www.wch-ic.com/products/CH343.html
;   Linux: usually works out of the box (ch341 kernel module)
; ================================================================

; Only build the firmware by default. Without this, a bare `pio run` (and the
; VSCode build button) also tries to build [env:native], which needs a native
; g++ that Windows doesn't ship -- so it reports FAILED next to a perfectly
; good firmware build. Run the host tests via scripts/run_native_tests.ps1.
[platformio]
default_envs = freenove-esp32s3-cam

[env:freenove-esp32s3-cam]
platform  = espressif32
board     = freenove_esp32_s3_wroom   ; correct board - CH343 serial, OPI PSRAM
framework = arduino
; Override flash size to match your actual 16MB chip
board_upload.flash_size       = 16MB
board_build.flash_size        = 16MB
; OPI PSRAM mode - required for the RGB565 frame buffer at QVGA
board_build.arduino.memory_type = qio_opi
; Larger app partition (camera lib is large, and WiFi debug adds ~600KB)
board_build.partitions        = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM         ; Enable PSRAM in Arduino framework
    -DSERIAL_BAUD=921600      ; must match monitor_speed below
    ; WiFi debug telemetry. OFF at every boot and never persisted, so it cannot
    ; come up on its own during a match. For a binary with no radio in it at
    ; all, build [env:competition] below instead.
    -DENABLE_WIFI_DEBUG
lib_deps =
    https://github.com/espressif/esp32-camera.git
; 921600, not 115200: at 115200 a ~90-char detection line costs ~7.8 ms of
; blocking transmit, roughly a quarter of a 30 fps frame budget. CH343 handles
; this speed comfortably. If your terminal garbles output, drop both this and
; SERIAL_BAUD above to 460800.
monitor_speed = 921600

; ================================================================
; Competition build:  pio run -e competition -t upload
;
; Identical to the debug firmware except wifi_debug.cpp is excluded from the
; build entirely, so the radio, the HTTP servers and the JPEG encoder are not
; in the binary at all. wifi_debug.h supplies inline no-op stubs, so nothing
; else needs an #ifdef.
;
; Excluding the FILE (rather than just dropping the -D flag) is what actually
; works: PlatformIO's dependency finder text-scans for #include and would pull
; the whole WiFi stack in from a line sitting inside a disabled #ifdef.
; ================================================================
[env:competition]
extends = env:freenove-esp32s3-cam
build_src_filter = +<*> -<wifi_debug.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DSERIAL_BAUD=921600

; ================================================================
; Host-side unit tests:  pio test -e native
;
; The detection pipeline (LUT, CCA, filter, tracker) deliberately avoids
; <Arduino.h> and <esp_camera.h> so it can be tested on a PC against synthetic
; frames.
;
; Needs a native gcc, which Windows doesn't ship -- on this machine use
; scripts/run_native_tests.ps1 instead, which drives Visual Studio's compiler.
; ================================================================
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<blob_detect.cpp> +<color_lut.cpp> +<blob_filter.cpp> +<tracker.cpp>
build_flags = -I include -std=gnu++17 -Wall -Wextra
